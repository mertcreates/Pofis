name: Pofis kontrolleri
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pofis-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

name: Pofi Mini masaüstü kontrolü
on:
  pull_request:
    paths:
      - "electron/**"
      - "src/app/mini/**"
      - "src/components/mini/**"
      - "scripts/electron/**"
      - "src/lib/ui-text.js"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pofi-mini-check.yml"
permissions:
  contents: read
jobs:
  desktop-mini:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Pofi Mini davranışı ve tür kontrolü
        run: |
          bun test ./electron/background.test.cjs ./electron/mini-window.test.cjs ./electron/menu-clock.test.cjs ./src/desktop/notification-runtime.test.ts
          bun run typecheck
      - name: Electron uygulamasını üret
        run: bun run desktop:package
      - name: Uygulama paketinin açılışını doğrula
        run: bun scripts/electron/smoke.cjs
      - name: Mac deneme uygulamasını ZIP'e al
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PACKAGE=$(find dist/macos -maxdepth 1 -type d -name 'Pofis-darwin-*' -print -quit)
          test -n "$PACKAGE"
          mkdir -p dist/previews
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$PACKAGE/Pofis.app" "dist/previews/Pofis-mac-${{ runner.arch }}.zip"
      - name: Windows deneme uygulamasını ZIP'e al
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/windows -Directory | Where-Object { $_.Name -like 'Pofis-win32-*' } | Sort-Object Name | Select-Object -Last 1
          if (!$package) { throw 'Windows paketi bulunamadı.' }
          New-Item -ItemType Directory -Force dist/previews | Out-Null
          Compress-Archive -Path (Join-Path $package.FullName '*') -DestinationPath dist/previews/Pofis-windows-x64.zip -CompressionLevel Optimal
      - name: Deneme paketi ve kabul ekran görüntüleri
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pofis-preview-${{ matrix.os }}
          path: |
            dist/previews/*.zip
            dist/electron/checks/preview/*.png
          if-no-files-found: error
          retention-days: 30

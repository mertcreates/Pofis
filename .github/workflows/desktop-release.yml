name: Pofis sürümünü yayımla
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pofis-production-release
  cancel-in-progress: false
jobs:
  begin:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Sürümü package.json dosyasından al
        id: version
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($releaseVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'package.json sürümü x.y.z biçiminde olmalı.'
          }
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
      - name: Sürümü kontrol et
        run: bun scripts/electron/ci-build.cjs check
      - name: Tanıtım sitesinin deposunu al
        shell: pwsh
        run: |
          $siteDirectory = Join-Path $env:RUNNER_TEMP 'pofis-landing'
          "SITE_DIRECTORY=$siteDirectory" >> $env:GITHUB_ENV
          git clone --depth 1 --branch main https://github.com/mertcreates/pofis-landing.git "$siteDirectory"
      - name: Sürüm taslağını hazırla
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs begin
  build:
    needs: begin
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.begin.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Tanıtım sitesinin deposunu al
        shell: pwsh
        run: |
          $siteDirectory = Join-Path $env:RUNNER_TEMP 'pofis-landing'
          "SITE_DIRECTORY=$siteDirectory" >> $env:GITHUB_ENV
          git clone --depth 1 --branch main https://github.com/mertcreates/pofis-landing.git "$siteDirectory"
      - name: Tamamlanmış platform paketinden devam et
        id: recover
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs recover
      - name: Bun ve Electron indirme cache'ini yükle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pofis-downloads
          key: downloads-v1-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            downloads-v1-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-
            downloads-v1-${{ matrix.target }}-bun-1.4.3-
      - name: İndirme cache yollarını ayarla
        shell: pwsh
        run: |
          "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'pofis-downloads/bun')" >> $env:GITHUB_ENV
          "electron_config_cache=$(Join-Path $env:RUNNER_TEMP 'pofis-downloads/electron')" >> $env:GITHUB_ENV
      - name: Next derleme cache'ini yükle
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-v1-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-
      - name: Kilitli bağımlılıkları kur
        if: steps.recover.outputs.reuse != 'true'
        run: bun install --frozen-lockfile
      - name: Türleri doğrula
        if: steps.recover.outputs.reuse != 'true'
        run: bun run typecheck
      - name: Testleri çalıştır
        if: steps.recover.outputs.reuse != 'true'
        run: bun test
      - name: Yerel platform paketini üret ve gerçek uygulamayı sına
        if: steps.recover.outputs.reuse != 'true'
        run: bun scripts/electron/ci-build.cjs build
      - name: Doğrulanmış paketi sürüm taslağına aktar
        if: steps.recover.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs stage
      - name: Intel kaynaklarını ayrı çalışma dizinine al
        if: runner.os == 'macOS'
        shell: bash
        run: |
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pofis-intel"
          git -C "$RUNNER_TEMP/pofis-intel" checkout --detach "$GITHUB_SHA"
      - name: Intel Next derleme cache'ini yükle
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pofis-intel/.next/cache
          key: next-v1-darwin-x64-bun-1.4.3-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-v1-darwin-x64-bun-1.4.3-${{ hashFiles('bun.lock') }}-
      - name: Intel derleme ortamını hazırla
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          echo 'RELEASE_TARGET=darwin-x64' >> "$GITHUB_ENV"
          echo 'npm_config_arch=x64' >> "$GITHUB_ENV"
          echo 'npm_config_platform=darwin' >> "$GITHUB_ENV"
          echo 'npm_config_target_arch=x64' >> "$GITHUB_ENV"
          echo 'ELECTRON_INSTALL_ARCH=x64' >> "$GITHUB_ENV"
          echo 'ELECTRON_INSTALL_PLATFORM=darwin' >> "$GITHUB_ENV"
      - name: Intel Bun 1.4.3 kur
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/pofis-downloads/bun-darwin-x64-1.4.3.zip"
          mkdir -p "$RUNNER_TEMP/pofis-downloads"
          if [ ! -f "$archive" ]; then
            curl --fail --location --output "$archive" https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-darwin-x64.zip
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP/pofis-bun-intel"
          echo "$RUNNER_TEMP/pofis-bun-intel/bun-darwin-x64" >> "$GITHUB_PATH"
      - name: Tamamlanmış Intel paketinden devam et
        if: runner.os == 'macOS'
        id: recover_intel
        working-directory: ${{ runner.temp }}/pofis-intel
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs recover
      - name: Intel bağımlılıklarını kur
        if: runner.os == 'macOS' && steps.recover_intel.outputs.reuse != 'true'
        working-directory: ${{ runner.temp }}/pofis-intel
        env:
          npm_config_arch: x64
          npm_config_platform: darwin
          npm_config_target_arch: x64
          ELECTRON_INSTALL_ARCH: x64
          ELECTRON_INSTALL_PLATFORM: darwin
        run: |
          bun -e 'if (process.platform !== "darwin" || process.arch !== "x64" || Bun.version !== "1.4.3") throw Error("Intel Bun 1.4.3 gerekli")'
          bun install --frozen-lockfile
      - name: Intel paketini üret ve statik kontrolleri çalıştır
        if: runner.os == 'macOS' && steps.recover_intel.outputs.reuse != 'true'
        working-directory: ${{ runner.temp }}/pofis-intel
        env:
          npm_config_arch: x64
          npm_config_platform: darwin
          npm_config_target_arch: x64
          ELECTRON_INSTALL_ARCH: x64
          ELECTRON_INSTALL_PLATFORM: darwin
        run: bun scripts/electron/ci-build.cjs build
      - name: Intel paketini sürüm taslağına aktar
        if: runner.os == 'macOS' && steps.recover_intel.outputs.reuse != 'true'
        working-directory: ${{ runner.temp }}/pofis-intel
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs stage
  cleanup:
    needs: [begin, build]
    if: ${{ always() && needs.begin.result == 'success' && needs.build.result == 'failure' }}
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.begin.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Başarısız derlemenin sürüm taslağını sil
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs cleanup
      - name: Yeniden deneme bilgisini göster
        shell: pwsh
        run: |
          "## Pofis $env:RELEASE_VERSION`nDerleme başarısız oldu. Taslak temizleme adımı tamamlandı.`n`nDüzeltmeden sonra Run workflow veya Re-run all jobs ile tüm akışı yeniden başlat." >> $env:GITHUB_STEP_SUMMARY
  publish:
    needs: [begin, build]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.begin.outputs.version }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Tanıtım sitesinin deposunu al
        shell: pwsh
        run: |
          $siteDirectory = Join-Path $env:RUNNER_TEMP 'pofis-landing'
          "SITE_DIRECTORY=$siteDirectory" >> $env:GITHUB_ENV
          git clone --depth 1 --branch main https://github.com/mertcreates/pofis-landing.git "$siteDirectory"
      - name: Üç paketi doğrula ve dağıtım dosyalarını hazırla
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs prepare
      - name: Site çıktısını doğrula
        working-directory: ${{ env.SITE_DIRECTORY }}
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
      - name: Sürümü ve site değişikliğini yayımla
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs publish
      - name: Canlı HTTPS dağıtımını doğrula
        run: bun scripts/electron/publish.cjs verify
      - name: Sonucu özetle
        if: always()
        env:
          RELEASE_RESULT: ${{ job.status }}
        run: |
          "## Pofis $env:RELEASE_VERSION`nSonuç: $env:RELEASE_RESULT`n`nWindows x64 · macOS Apple Silicon · macOS Intel`n`nhttps://pofis.app`n`nHatalı adımı inceleyip aynı sürümle yeniden çalıştırabilirsin. Tamamlanmış platform paketleri yeniden üretilmez." >> $env:GITHUB_STEP_SUMMARY

name: Pofis sürümünü yayımla
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Paketler doğrulandıktan sonra sürümü yayımla'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pofis-production-release
  cancel-in-progress: false
jobs:
  begin:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Sürümü package.json dosyasından al
        id: version
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($releaseVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'package.json sürümü x.y.z biçiminde olmalı.'
          }
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
      - name: Sürümü kontrol et
        run: bun scripts/electron/ci-build.cjs check
      - name: Tanıtım sitesinin deposunu al
        shell: pwsh
        run: |
          $siteDirectory = Join-Path $env:RUNNER_TEMP 'pofis-landing'
          "SITE_DIRECTORY=$siteDirectory" >> $env:GITHUB_ENV
          git clone --depth 1 --branch main https://github.com/mertcreates/pofis-landing.git "$siteDirectory"
      - name: Ortak Unix ve Windows kurulum komutlarını doğrula
        run: bun scripts/electron/publish.cjs check-site
      - name: Sürüm taslağını hazırla
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs begin
  build:
    needs: begin
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.begin.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Tanıtım sitesinin deposunu al
        shell: pwsh
        run: |
          $siteDirectory = Join-Path $env:RUNNER_TEMP 'pofis-landing'
          "SITE_DIRECTORY=$siteDirectory" >> $env:GITHUB_ENV
          git clone --depth 1 --branch main https://github.com/mertcreates/pofis-landing.git "$siteDirectory"
      - name: Tamamlanmış platform paketinden devam et
        if: inputs.publish
        id: recover
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs recover
      - name: Bun ve Electron indirme cache'ini yükle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pofis-downloads
          key: downloads-v2-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}
          restore-keys: |
            downloads-v2-${{ matrix.target }}-bun-1.4.3-
      - name: İndirme cache yollarını ayarla
        shell: pwsh
        run: |
          "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'pofis-downloads/bun')" >> $env:GITHUB_ENV
          "electron_config_cache=$(Join-Path $env:RUNNER_TEMP 'pofis-downloads/electron')" >> $env:GITHUB_ENV
      - name: Next derleme cache'ini yükle
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-v1-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ matrix.target }}-bun-1.4.3-${{ hashFiles('bun.lock') }}-
      - name: Kilitli bağımlılıkları kur
        if: steps.recover.outputs.reuse != 'true'
        run: bun install --frozen-lockfile
      - name: Windows paketini üret ve gerçek uygulamayı sına
        if: runner.os == 'Windows' && steps.recover.outputs.reuse != 'true'
        run: bun scripts/electron/ci-build.cjs build
      - name: Doğrulanmış Windows paketini sürüm taslağına aktar
        if: inputs.publish && runner.os == 'Windows' && steps.recover.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs stage
      - name: Intel ve Linux kaynaklarını ayrı çalışma dizinlerine al
        if: runner.os == 'macOS'
        shell: bash
        run: |
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pofis-intel"
          git -C "$RUNNER_TEMP/pofis-intel" checkout --detach "$GITHUB_SHA"
          git clone --no-hardlinks "$SITE_DIRECTORY" "${SITE_DIRECTORY}-intel"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pofis-linux"
          git -C "$RUNNER_TEMP/pofis-linux" checkout --detach "$GITHUB_SHA"
          git clone --no-hardlinks "$SITE_DIRECTORY" "${SITE_DIRECTORY}-linux"
      - name: Tamamlanmış Intel paketinden devam et
        if: inputs.publish && runner.os == 'macOS'
        id: recover_intel
        working-directory: ${{ runner.temp }}/pofis-intel
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
          RELEASE_TARGET: darwin-x64
        run: bun scripts/electron/publish.cjs recover
      - name: Tamamlanmış Linux paketinden devam et
        if: inputs.publish && runner.os == 'macOS'
        id: recover_linux
        working-directory: ${{ runner.temp }}/pofis-linux
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
          RELEASE_TARGET: linux-x64
        run: bun scripts/electron/publish.cjs recover
      - name: ARM64 kabulünü, Intel ve Linux statik paketlerini tamamla
        if: runner.os == 'macOS'
        env:
          REUSE_NATIVE: ${{ steps.recover.outputs.reuse }}
          REUSE_INTEL: ${{ steps.recover_intel.outputs.reuse }}
          REUSE_LINUX: ${{ steps.recover_linux.outputs.reuse }}
        run: bun scripts/electron/macos-ci.cjs
      - name: Doğrulanmış macOS ve Linux paketlerini sürüm taslağına aktar
        if: inputs.publish && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
          REUSE_NATIVE: ${{ steps.recover.outputs.reuse }}
          REUSE_INTEL: ${{ steps.recover_intel.outputs.reuse }}
          REUSE_LINUX: ${{ steps.recover_linux.outputs.reuse }}
        run: bun scripts/electron/macos-ci.cjs stage
  cleanup:
    needs: [begin, build]
    if: ${{ always() && inputs.publish && needs.begin.result == 'success' && needs.build.result == 'failure' }}
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.begin.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Başarısız derlemenin sürüm taslağını sil
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs cleanup
      - name: Yeniden deneme bilgisini göster
        shell: pwsh
        run: |
          "## Pofis $env:RELEASE_VERSION`nDerleme başarısız oldu. Taslak temizleme adımı tamamlandı.`n`nDüzeltmeden sonra Run workflow veya Re-run all jobs ile tüm akışı yeniden başlat." >> $env:GITHUB_STEP_SUMMARY
  publish:
    if: inputs.publish
    needs: [begin, build]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.begin.outputs.version }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Tanıtım sitesinin deposunu al
        shell: pwsh
        run: |
          $siteDirectory = Join-Path $env:RUNNER_TEMP 'pofis-landing'
          "SITE_DIRECTORY=$siteDirectory" >> $env:GITHUB_ENV
          git clone --depth 1 --branch main https://github.com/mertcreates/pofis-landing.git "$siteDirectory"
      - name: Dört paketi doğrula ve dağıtım dosyalarını hazırla
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs prepare
      - name: Site çıktısını doğrula
        working-directory: ${{ env.SITE_DIRECTORY }}
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
      - name: Sürümü ve site değişikliğini yayımla
        env:
          GH_TOKEN: ${{ secrets.POFIS_RELEASE_TOKEN }}
        run: bun scripts/electron/publish.cjs publish
      - name: Canlı HTTPS dağıtımını doğrula
        run: bun scripts/electron/publish.cjs verify
      - name: Sonucu özetle
        if: always()
        env:
          RELEASE_RESULT: ${{ job.status }}
        run: |
          "## Pofis $env:RELEASE_VERSION`nSonuç: $env:RELEASE_RESULT`n`nWindows x64 · macOS Apple Silicon · macOS Intel · Ubuntu x64`n`nhttps://pofis.app`n`nHatalı adımı inceleyip aynı sürümle yeniden çalıştırabilirsin. Tamamlanmış platform paketleri yeniden üretilmez." >> $env:GITHUB_STEP_SUMMARY
